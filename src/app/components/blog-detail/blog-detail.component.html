<div class="blog-detail-container">
  <!-- Loading State -->
  <div *ngIf="loading" class="loading-container">
    <div class="loading-spinner"></div>
    <p>Loading blog post...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="error-container">
    <div class="error-message">
      <h3>Oops! Something went wrong</h3>
      <p>{{ error }}</p>
      <div class="error-actions">
        <button (click)="retry()" class="retry-button">Try Again</button>
        <button (click)="goBack()" class="back-button">Back to Blog List</button>
      </div>
    </div>
  </div>

  <!-- Blog Content -->
  <article *ngIf="!loading && !error && blog" class="blog-article">
    <!-- Navigation -->
    <nav class="blog-nav">
      <button (click)="goBack()" class="back-btn">
        <span class="arrow">←</span>
        Back to Stories
      </button>
    </nav>

    <!-- Blog Header -->
    <header class="blog-header">
      <div class="blog-image-container">
        <img 
          [src]="blog.image" 
          [alt]="blog.title" 
          class="blog-featured-image"
          (error)="onImageError($event)"
          (load)="onImageLoad($event)"
        />
      </div>
      
      <div class="blog-header-content">
        <h1 class="blog-title">{{ blog.title }}</h1>
        
        <div class="blog-meta">
          <div class="meta-item">
            <span class="meta-label">Published:</span>
            <span class="meta-value">{{ getFormattedDate(blog.published) }}</span>
          </div>
        </div>
        
        <blockquote *ngIf="blog.quote" class="blog-quote">
          "{{ blog.quote }}"
        </blockquote>
      </div>
    </header>

    <!-- Blog Content -->
    <section class="blog-content">
      <div class="content-wrapper" [innerHTML]="blog.content">
        <!-- Blog content will be inserted here -->
      </div>
    </section>

    <!-- Blog Footer -->
    <footer class="blog-footer">
      <div class="footer-actions">
        <a (click)="goBack()" class="back-to-list-link">
          ← Back to Stories
        </a>
      </div>
    </footer>
  </article>
</div>
